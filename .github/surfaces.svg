<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 108 1100 492" width="1100" height="492" role="img" aria-label="A marimo notebook in a browser and an agent in Claude Code call the same MCP endpoint, POST /api/mcp">
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #1f1f1c; }
    .muted { fill: #76736b; }
    .panel { fill: #fbfaf7; stroke: #d8d4c8; stroke-width: 1.5; }
    .cell { fill: #fff; stroke: #d8d4c8; stroke-width: 1.25; }
    .call { stroke: #3a3a36; stroke-width: 1.5; fill: none; }
    .bubble { fill: #ebe8e0; }
    .card { fill: #fff; stroke: #d8d4c8; stroke-width: 1.25; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a36" />
    </marker>
  </defs>
  <rect width="1100" height="600" fill="#f2efe7" />
  <!-- The notebook in a browser tab -->
  <rect x="70" y="148" width="470" height="300" rx="10" class="panel" />
  <path d="M70,190 V158 a10,10 0 0 1 10,-10 H530 a10,10 0 0 1 10,10 V190 z" fill="#eeebe3" />
  <circle cx="90" cy="169" r="5" fill="#ec6a5e" />
  <circle cx="106" cy="169" r="5" fill="#f4bf4f" />
  <circle cx="122" cy="169" r="5" fill="#61c554" />
  <rect x="140" y="156" width="190" height="34" rx="7" fill="#fbfaf7" />
  <text x="156" y="178" class="sans ink" font-size="13">demo.py · marimo</text>
  <rect x="84" y="200" width="442" height="26" rx="13" fill="#efece5" />
  <text x="100" y="218" class="sans muted" font-size="13">localhost:2718/?file=demo.py</text>
  <text x="100" y="262" class="serif ink" font-size="20">Sampling a normal distribution</text>
  <rect x="96" y="276" width="418" height="36" rx="7" class="cell" />
  <text x="110" y="299" class="sans ink" font-size="12.5">samples</text>
  <rect x="166" y="292" width="150" height="5" rx="2.5" fill="#d8d4c8" />
  <rect x="166" y="292" width="112" height="5" rx="2.5" fill="#228be6" />
  <circle cx="278" cy="294.5" r="7" fill="#74c0fc" stroke="#228be6" stroke-width="1.5" />
  <text x="326" y="299" class="sans muted" font-size="11.5">1,500</text>
  <rect x="96" y="320" width="418" height="116" rx="7" class="cell" />
  <rect x="116" y="401" width="13" height="3" fill="#3d4733" />
  <rect x="131" y="399" width="13" height="5" fill="#3d4733" />
  <rect x="146" y="395" width="13" height="9" fill="#3d4733" />
  <rect x="161" y="389" width="13" height="15" fill="#3d4733" />
  <rect x="176" y="380" width="13" height="24" fill="#3d4733" />
  <rect x="191" y="370" width="13" height="34" fill="#3d4733" />
  <rect x="206" y="359" width="13" height="45" fill="#3d4733" />
  <rect x="221" y="352" width="13" height="52" fill="#3d4733" />
  <rect x="236" y="348" width="13" height="56" fill="#3d4733" />
  <rect x="251" y="354" width="13" height="50" fill="#3d4733" />
  <rect x="266" y="363" width="13" height="41" fill="#3d4733" />
  <rect x="281" y="374" width="13" height="30" fill="#3d4733" />
  <rect x="296" y="384" width="13" height="20" fill="#3d4733" />
  <rect x="311" y="392" width="13" height="12" fill="#3d4733" />
  <rect x="326" y="397" width="13" height="7" fill="#3d4733" />
  <rect x="341" y="400" width="13" height="4" fill="#3d4733" />
  <rect x="235" y="342" width="3.5" height="62" fill="#e8590c" />
  <path d="M112,405 H352" stroke="#1f1f1c" stroke-width="1" />
  <path d="M284,314 l0,16 l4.5,-4.5 l3,7 l3,-1.3 l-3,-7 l6.5,0 z" fill="#1f1f1c" stroke="#fff" stroke-width="1" />
  <rect x="296" y="330" width="34" height="18" rx="6" fill="#3d4733" />
  <text x="313" y="343" class="sans" font-size="11" font-weight="600" fill="#f2efe7" text-anchor="middle">You</text>
  <!-- An agent in Claude Code -->
  <rect x="560" y="148" width="470" height="300" rx="10" class="panel" />
  <text x="578" y="178" class="sans" font-size="17" fill="#d97757">✳</text>
  <text x="598" y="178" class="sans ink" font-size="15" font-weight="600">Claude Code</text>
  <path d="M560,192 H1030" stroke="#e4e0d5" stroke-width="1.25" />
  <rect x="700" y="206" width="316" height="56" rx="10" class="bubble" />
  <text x="714" y="229" class="sans ink" font-size="13">Plot my samples as a histogram,</text>
  <text x="714" y="249" class="sans ink" font-size="13">then mark the mean.</text>
  <rect x="575" y="276" width="441" height="64" rx="8" class="card" />
  <text x="589" y="298" class="sans muted" font-size="12">Ran a command</text>
  <text x="589" y="322" class="mono ink" font-size="12.5">marimo pair execute --session nb-… --file -</text>
  <text x="575" y="368" class="sans ink" font-size="13">Done. The histogram and its mean are in your notebook.</text>
  <rect x="575" y="404" width="441" height="30" rx="8" class="card" />
  <text x="589" y="424" class="sans muted" font-size="12.5">Reply to Claude…</text>
  <!-- Both make the same calls -->
  <path d="M305,454 V500" class="call" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="317" y="473" class="serif ink" font-size="14">tools/call</text>
  <text x="317" y="491" class="serif ink" font-size="14">events/stream</text>
  <path d="M795,454 V500" class="call" marker-start="url(#tip)" marker-end="url(#tip)" />
  <text x="807" y="482" class="serif ink" font-size="14">tools/call</text>
  <rect x="70" y="504" width="960" height="56" fill="#3d4733" />
  <text x="94" y="539" class="serif" font-size="22" font-weight="700" fill="#f2efe7">marimo</text>
  <text x="196" y="538" class="mono" font-size="16" fill="#e7e3d6">POST /api/mcp</text>
</svg>
